<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{TITLE}}</title>
  <style>
    :root{--ink:#172033;--muted:#687086;--line:#e7e9f0;--paper:#fff;--bg:#f4f6fa;--brand:#6259e8;--brand2:#ee5f79;--soft:#f0efff;--good:#087f5b;--warn:#b45309;--shadow:0 12px 34px rgba(24,32,51,.07)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% 0,#ebe9ff 0,transparent 32%),var(--bg);color:var(--ink);font:15px/1.72 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:1080px;margin:auto;padding:42px 22px 64px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#171c33 0,#34377a 58%,#6b4eb7 100%);color:#fff;padding:42px;border-radius:28px;box-shadow:0 22px 55px rgba(40,36,100,.2)}.hero:after{content:"";position:absolute;width:290px;height:290px;border-radius:50%;right:-95px;top:-120px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,0))}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border:1px solid rgba(255,255,255,.24);border-radius:99px;background:rgba(255,255,255,.1);font-size:12px;letter-spacing:.08em}.score-row{display:flex;align-items:flex-end;gap:24px;margin:22px 0 12px}.score{font-size:64px;line-height:.95;font-weight:850;letter-spacing:-.06em;color:#ffe27a}.score small{font-size:20px;letter-spacing:0;color:rgba(255,255,255,.72)}.hero h1{margin:0;font-size:clamp(28px,5vw,46px);line-height:1.15;letter-spacing:-.035em}.hero .lead{max-width:800px;margin:14px 0 0;color:rgba(255,255,255,.86);font-size:16px}.verdict{font-weight:700;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.metric-card{min-height:118px;display:flex;flex-direction:column;justify-content:center}.metric{font-size:28px;line-height:1.1;font-weight:820;letter-spacing:-.04em;color:var(--brand);margin-bottom:7px}.label{color:var(--muted);font-size:13px}.section{margin-top:36px}.section-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.section-index{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--brand);font-weight:800;font-size:12px}.section h2{margin:0;font-size:23px;letter-spacing:-.025em}.table-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;vertical-align:top;padding:15px 17px;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}th{background:#fafaff;color:#505873;font-size:12px;text-transform:uppercase;letter-spacing:.05em}td:nth-child(2){font-size:19px;font-weight:800;color:var(--brand);white-space:nowrap}.evidence{position:relative;margin:10px 0 0;padding:10px 12px 10px 15px;border-left:3px solid var(--brand);border-radius:0 9px 9px 0;background:#f7f6ff;color:#424a62}.small{color:var(--muted);font-size:12px}.signal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.signal-grid .card b{display:block;font-size:16px;margin-bottom:5px}.signal-grid .card p{margin:0 0 10px;color:#424a62}.card p:first-child{margin-top:0}.card p:last-child{margin-bottom:0}.fact-list{margin:0;padding-left:20px}.fact-list li{margin:7px 0}.tag{display:inline-flex;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--brand);font-size:12px;font-weight:700}.footer{margin-top:38px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.footer strong{color:var(--ink)}
    @media(max-width:800px){.wrap{padding:22px 14px 44px}.hero{padding:28px 24px;border-radius:22px}.score-row{display:block}.score{font-size:52px;margin-bottom:14px}.grid{grid-template-columns:repeat(2,1fr)}.signal-grid{grid-template-columns:1fr}.section{margin-top:28px}}
    @media(max-width:430px){.grid{grid-template-columns:1fr}.metric-card{min-height:auto}.hero h1{font-size:29px}}
    @media print{body{background:#fff}.wrap{max-width:none;padding:0}.hero,.card,.table-wrap{box-shadow:none}.hero{border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.section{break-inside:avoid}.card{break-inside:avoid}}
  </style>
</head>
<body><main class="wrap">{{BODY}}</main></body>
</html>
